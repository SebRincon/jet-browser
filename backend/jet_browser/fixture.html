<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Juniper workshop — Jet Browser demo</title>
<style>
:root{color-scheme:dark;--page:#101315;--surface:#191e21;--ink:#edf2ee;--muted:#b5c1b8;--line:#53635a;--accent:#afd9bb}
*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font:16px system-ui}main{max-width:620px;margin:40px auto;padding:32px;background:var(--surface);border:1px solid #35433a;border-radius:12px}small{color:var(--accent);font-size:11px;font-weight:650;letter-spacing:.12em}h1{font:38px Georgia;margin:16px 0}p{line-height:1.6;color:var(--muted)}label{display:block;margin:18px 0 7px;font-weight:550}input:not([type=checkbox]),select{width:100%;padding:11px;font:inherit;color:var(--ink);border:1px solid var(--line);border-radius:6px;background:#101614}input[type=checkbox]{width:17px;height:17px;vertical-align:middle;accent-color:var(--accent)}button{font:inherit;font-weight:650;padding:12px 20px;border:0;background:var(--accent);color:#15251a;border-radius:6px;margin-top:20px;cursor:pointer}button:hover{background:#c5e7cf}:focus-visible{outline:2px solid #c5e7cf;outline-offset:3px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#101614;border:1px solid #35433a;border-radius:6px;padding:18px;line-height:1.8;color:#d5efdd}.hint{font-size:13px;color:var(--muted)}@media(max-width:680px){main{margin:20px 16px;padding:24px}h1{font-size:32px}}
</style><main><small>JET BROWSER / LOCAL PRACTICE PAGE</small><h1>Juniper workshop</h1><p>A real form you can use to watch the local models. Previewing keeps everything on this computer.</p>
<div id="content"><form id="registration"><label for="team">Team name</label><input id="team" name="team" autocomplete="off"><label for="email">Contact email</label><input id="email" name="email" type="email" autocomplete="off"><label for="session">Session</label><select id="session" name="session"><option>Morning</option><option>Afternoon</option><option>Evening</option></select><label><input name="updates" id="updates" type="checkbox"> Updates</label><button type="submit">Preview registration</button></form></div>
<p class="hint">Try: Enter Solstice in Team name; type ash@example.test in Contact email; set Session to Afternoon; enable Updates; open Preview registration.</p>
<script>
const query=new URLSearchParams(location.search);for(const key of ["team","email"]){if(query.has(key))document.getElementById(key).value=query.get(key);}
document.querySelector('form').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);window.jetReceipt={team:f.get('team'),email:f.get('email'),session:f.get('session'),updates:f.has('updates')};document.title='Registration preview · Juniper workshop';document.querySelector('h1').textContent='Registration preview';const c=document.querySelector('#content');c.replaceChildren();const h=document.createElement('h2');h.textContent='Registration details';const pre=document.createElement('pre');pre.id='receipt';pre.textContent=Object.entries(window.jetReceipt).map(([k,v])=>k+': '+v).join('\n');const b=document.createElement('button');b.textContent='Edit registration';b.onclick=()=>location.reload();c.append(h,pre,b)});
</script></main></html>
