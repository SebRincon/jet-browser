[project]
name = "jet-browser-service"
version = "0.1.0"
description = "Standalone native browser control and local model delegation"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.12,<4",
    "httpx[http2]>=0.28,<1",
    "opentelemetry-sdk>=1.37,<2",
]

[dependency-groups]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=1,<2", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 120
exclude = ["jev_ultrafast"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
