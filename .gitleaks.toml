title = "Jet Browser secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "SHA256 file fingerprints in two source-provenance manifests"
condition = "AND"
paths = ['^tasks/browser-lab-baseline\.json$']
regexTarget = "line"
regexes = ['^\+?\s*"(?:app/lib/[^"\r\n]+\.dart|macos/Frameworks/include/[^"\r\n]+\.h)": "[a-f0-9]{64}",?\s*$']
