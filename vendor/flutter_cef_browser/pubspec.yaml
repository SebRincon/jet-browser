name: flutter_cef_browser
description: High-performance native CEF browser integration for Flutter macOS with direct GPU rendering.
version: 1.0.0
homepage: https://github.com/anthropics/flutter_cef_browser

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  plugin:
    platforms:
      macos:
        pluginClass: FlutterCefBrowserPlugin
